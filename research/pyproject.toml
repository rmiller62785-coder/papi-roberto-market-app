[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aperture-nvda-research"
version = "0.1.0"
description = "Point-in-time dataset manifests and walk-forward evaluation for Aperture NVDA"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
aperture-research = "aperture_research.cli:main"
aperture-proxy-bootstrap = "aperture_research.proxy_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
